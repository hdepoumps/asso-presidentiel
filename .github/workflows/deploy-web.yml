# Vérifie le site (lint, tests, build) à chaque push sur main. Vercel publie de son côté (middleware.ts).
# Publication sur o2switch, derrière le même code d'accès (server/o2switch/), dès que la variable de dépôt
# O2SWITCH_FTP_HOST est définie (voir README, « o2switch »). Sans elle, cette partie est ignorée.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  # Jamais interrompu en plein envoi FTP : le déploiement suivant attend la fin du précédent.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Assembler le paquet o2switch
        if: github.ref == 'refs/heads/main' && vars.O2SWITCH_FTP_HOST != ''
        run: node scripts/o2switch-bundle.mjs

      # FTPS (chiffré, certificat vérifié). Ordre d'envoi : d'abord les nouveaux fichiers, puis les pages qui
      # les appellent (index.html, sw.js), enfin la suppression des anciens : le site n'est jamais à moitié à jour.
      - name: Publier sur o2switch
        if: github.ref == 'refs/heads/main' && vars.O2SWITCH_FTP_HOST != ''
        env:
          FTP_HOST: ${{ vars.O2SWITCH_FTP_HOST }}
          FTP_USER: ${{ vars.O2SWITCH_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set cmd:fail-exit true
          mirror --reverse --parallel=4 --exclude-glob site/index.html --exclude-glob site/sw.js dist-o2switch/ ./
          put -O site dist-o2switch/site/sw.js
          put -O site dist-o2switch/site/index.html
          mirror --reverse --delete --only-missing --exclude ^\.well-known/ --exclude ^\.ftpquota$ --exclude ^cgi-bin/ dist-o2switch/ ./
          EOF
