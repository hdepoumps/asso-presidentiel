# Compile l'application Android et la joint à l'exécution du workflow.
# Signature de publication facultative : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux, on produit un APK de test (clé de débogage).
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CST_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # v3 installait par défaut le paquet « tools », retiré du dépôt Google : sdkmanager échouait.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && node scripts/android-apk.mjs
      - name: Version signée (si la clé est configurée)
        if: ${{ env.HAS_KEY == 'true' }}
        # Secrets passés par l'environnement, jamais recopiés dans le script ; la clé est effacée même si la compilation échoue.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export CST_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$CST_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CST_KEYSTORE_PATH"
          node scripts/android-apk.mjs --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cartes-sur-table-android
          path: release/*.apk
