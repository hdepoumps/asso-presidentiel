# Compile l'application Android et la joint à l'exécution du workflow.
# Signature de publication facultative : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Sans eux, on produit un APK de test (clé de débogage).
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CST_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && node scripts/android-apk.mjs
      - name: Version signée (si la clé est configurée)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          CST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          CST_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" node scripts/android-apk.mjs --release
      - uses: actions/upload-artifact@v4
        with:
          name: cartes-sur-table-android
          path: release/*.apk
